[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2mindshare"
version = "0.1.0"
description = "StarCraft II replays to Mindshare graphs: Stefan's Mindshare layer on a pinned upstream sc2reader"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
  "sc2reader==1.9.0",
]

[project.scripts]
sc2mindshare = "sc2mindshare.cli:main"

[project.optional-dependencies]
# Stream 3 (decoding) development tools; owned by stream 3 (TD-1), filled by its first PR after CR-009.
decode-dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc2mindshare = ["py.typed", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
norecursedirs = ["legacy", ".venv", ".venv-legacy", "test_replays", "test_s2gs"]
addopts = "--import-mode=importlib -p no:cacheprovider"
markers = [
  "pin_conformance: upstream sc2reader v1.9.0's own test suite, run against the pin (TD-7)",
  "network: needs the network (map downloads); deselect offline with -m 'not network'",
  "legacy: runs the old fork in this checkout's .venv-legacy; without it, deselect with -m 'not legacy' (CR-019)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
